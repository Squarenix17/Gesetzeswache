name: ci
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Verify modules
        run: go mod verify
      - name: Test (race)
        run: go test -race ./...
      - name: Coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage gate
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          # ratchet toward 80%
          awk -v p="$pct" 'BEGIN { if (p+0 < 66) { printf "coverage %.1f%% below gate 66%%\n", p; exit 1 } }'
          bash scripts/check-package-coverage.sh
      - name: Vet
        run: go vet ./...
      - name: Install staticcheck
        run: GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@2025.1
      - name: staticcheck
        run: staticcheck ./...
      - name: Install govulncheck
        run: GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...
      - name: Install gosec
        run: GOTOOLCHAIN=local go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
      - name: gosec
        run: gosec -quiet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o bin/gew ./cmd/gesetzeswache
  docker:
    timeout-minutes: 15
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHORT_SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${SHORT_SHA}" | cut -c1-7)
          VERSION=$(tr -d '[:space:]' < VERSION)
          docker build --build-arg "VERSION=${VERSION}" -t "${IMAGE}:latest" .
          if [ "${EVENT_NAME}" = "push" ]; then
            docker tag "${IMAGE}:latest" "${IMAGE}:sha-${SHORT_SHA}"
            docker tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:sha-${SHORT_SHA}"
            docker push "${IMAGE}:${VERSION}"
          fi
          if [ "${EVENT_NAME}" = "release" ]; then
            docker tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
            docker tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${TAG}"
            docker push "${IMAGE}:${VERSION}"
          fi
